name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *" # chạy mỗi ngày lúc 00:00 UTC
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: hungdeniubeo

      - name: Commit & push to output branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ./profile-3d-contrib/*.svg
          git commit -m "Update 3D contribution calendar" || exit 0
          git push origin main:output -f
