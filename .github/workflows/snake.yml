name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *" # chạy mỗi ngày lúc 00:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: hungdeniubeo
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2373D8EF&color_dots=%23161B22,%23223B57,%233B6EA8,%235486EE,%23AD92E4

      - name: Add breathing room around snake canvases
        run: |
          for file in dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg; do
            sed -i 's/viewBox="-16 -32 880 192" width="880" height="192"/viewBox="-24 -40 896 208" width="896" height="208"/' "$file"
            grep -q 'viewBox="-24 -40 896 208"' "$file"
          done

      - name: Fix dist permissions
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: hungdeniubeo

      - name: Copy 3D contribution assets to dist
        run: |
          mkdir -p dist/profile-3d-contrib
          cp profile-3d-contrib/*.svg dist/profile-3d-contrib/

      - name: Deploy all profile assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
