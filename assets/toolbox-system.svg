      <stop stop-color="#081422"/>
      <stop offset=".55" stop-color="#0b1526"/>
      <stop offset="1" stop-color="#151329"/>
    </linearGradient>
    <linearGradient id="toolbox-rail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67e8f9"/>
      <stop offset=".36" stop-color="#8da2fb"/>
      <stop offset=".7" stop-color="#b7a6e8"/>
      <stop offset="1" stop-color="#d6a0bd"/>
    </linearGradient>
    <pattern id="toolbox-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8da2fb" stroke-opacity=".045"/>
    </pattern>
    <filter id="toolbox-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="toolbox-clip"><rect width="1200" height="318" rx="20"/></clipPath>
  </defs>

