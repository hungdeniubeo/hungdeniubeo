<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="318" viewBox="0 0 1200 318" role="img" aria-labelledby="toolbox-title toolbox-desc">
  <title id="toolbox-title">Project-grounded working set</title>
  <desc id="toolbox-desc">A compact system map grouping technologies into interface, desktop, services, and vision layers, with Git and GitHub Actions on a shared delivery rail.</desc>
  <defs>
