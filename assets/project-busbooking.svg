<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-labelledby="bus-title bus-desc">
  <title id="bus-title">Busbooking route artwork</title>
  <desc id="bus-desc">A dark project card showing a bus route across four location nodes and a search, select, seat, and book flow.</desc>
  <defs>
    <linearGradient id="bus-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091827"/><stop offset="1" stop-color="#11162b"/></linearGradient>
    <linearGradient id="bus-route" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset=".52" stop-color="#8da2fb"/><stop offset="1" stop-color="#d6a0bd"/></linearGradient>
    <filter id="bus-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      .bus-packet { animation: bus-packet 7.5s ease-in-out infinite; }
      .bus-route-dash { animation: bus-dash 12s linear infinite; }
      @keyframes bus-packet { 0%, 10% { transform: translate(0, 0); opacity: 0; } 18% { opacity: 1; } 45% { transform: translate(170px, -46px); } 72% { transform: translate(335px, 3px); opacity: 1; } 88%, 100% { transform: translate(440px, -28px); opacity: 0; } }
      @keyframes bus-dash { to { stroke-dashoffset: -120; } }
      @media (prefers-reduced-motion: reduce) { .bus-packet, .bus-route-dash { animation: none !important; } }
    </style>
  </defs>
  <rect x="1" y="1" width="578" height="248" rx="18" fill="url(#bus-bg)" stroke="#344b68"/>
  <path d="M28 48H552" stroke="#263b54"/>
  <circle cx="29" cy="25" r="3.5" fill="#8da2fb"/>
  <text x="42" y="29" fill="#8fa2bd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.6">PROJECT / 03</text>
  <text x="551" y="29" text-anchor="end" fill="#63758d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.3">ROUTE / BOOKING</text>

  <g transform="translate(42 75)">
    <path d="M0 74C62 74 82 18 149 18S247 100 317 83S396 34 476 45" fill="none" stroke="#1d3249" stroke-width="15" stroke-linecap="round"/>
    <path d="M0 74C62 74 82 18 149 18S247 100 317 83S396 34 476 45" fill="none" stroke="url(#bus-route)" stroke-opacity=".84" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 9" class="bus-route-dash"/>
    <g fill="#0a1321" stroke-width="2">
      <circle cx="0" cy="74" r="10" stroke="#67e8f9"/><circle cx="149" cy="18" r="10" stroke="#8da2fb"/>
      <circle cx="317" cy="83" r="10" stroke="#b7a6e8"/><circle cx="476" cy="45" r="10" stroke="#d6a0bd"/>
    </g>
    <g fill="#dbe4f2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" text-anchor="middle">
      <text x="0" y="100">SEARCH</text><text x="149" y="-3">SELECT</text><text x="317" y="109">SEAT</text><text x="476" y="20">BOOK</text>
    </g>
    <g class="bus-packet" filter="url(#bus-glow)">
      <circle cx="0" cy="74" r="5" fill="#67e8f9"/>
    </g>
    <g transform="translate(187 36)">
      <rect width="104" height="50" rx="9" fill="#0a1321" stroke="#506b91"/>
      <path d="M15 14H89M15 25H66M15 36H78" stroke="#879bb8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="85" cy="36" r="3" fill="#d6a0bd"/>
    </g>
  </g>
  <g transform="translate(30 230)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">
    <text fill="#67e8f9">CLIENT</text><text x="51" fill="#526984">↔</text><text x="76" fill="#8da2fb">REST</text><text x="113" fill="#526984">↔</text><text x="138" fill="#b7a6e8">SERVICE</text>
    <text x="521" text-anchor="end" fill="#63758d">JWT / MYSQL</text>
  </g>
</svg>
