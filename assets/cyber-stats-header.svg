<svg viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neon Cyber Energy GitHub Stats">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070012"/>
      <stop offset="50%" stop-color="#120022"/>
      <stop offset="100%" stop-color="#05000c"/>
    </linearGradient>

    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#7B61FF;#FF3CAC;#FF7A18;#00F5FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FF3CAC">
        <animate attributeName="stop-color" values="#FF3CAC;#FF7A18;#00F5FF;#7B61FF;#FF3CAC" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF7A18">
        <animate attributeName="stop-color" values="#FF7A18;#00F5FF;#7B61FF;#FF3CAC;#FF7A18" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#FF3CAC"/>
      <stop offset="100%" stop-color="#FF7A18"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" rx="26" fill="url(#bg)"/>

  <!-- Ambient glow orbs -->
  <circle cx="130" cy="65" r="38" fill="#FF7A18" opacity="0.18" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.10;0.22;0.10" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="70" r="36" fill="#00F5FF" opacity="0.16" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.08;0.20;0.08" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Main cyber border -->
  <rect x="18" y="18" width="1164" height="184" rx="22"
        fill="none" stroke="url(#strokeGrad)" stroke-width="3.2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.70;1;0.72;1;0.70" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner accents -->
  <path d="M45 42 L95 42 L115 22" stroke="#00F5FF" stroke-width="3" fill="none" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M1155 42 L1105 42 L1085 22" stroke="#FF3CAC" stroke-width="3" fill="none" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M45 178 L95 178 L115 198" stroke="#7B61FF" stroke-width="3" fill="none" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M1155 178 L1105 178 L1085 198" stroke="#FF7A18" stroke-width="3" fill="none" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- Animated energy wave -->
  <g opacity="0.95">
    <path d="M0 170 Q30 150 60 170 T120 170 T180 170 T240 170 T300 170 T360 170 T420 170 T480 170 T540 170 T600 170 T660 170 T720 170 T780 170 T840 170 T900 170 T960 170 T1020 170 T1080 170 T1140 170 T1200 170"
          stroke="url(#waveGrad)" stroke-width="4" fill="none" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-60 0;0 0" dur="4.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Top scan line -->
  <line x1="90" y1="58" x2="1110" y2="58" stroke="#00F5FF" stroke-width="1.4" opacity="0.65" filter="url(#glow)">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Flame accent left -->
  <g transform="translate(92 88)" filter="url(#softGlow)">
    <path d="M0 32 C-16 16 -14 -6 0 -28 C14 -6 16 16 0 32Z" fill="#FF7A18">
      <animate attributeName="opacity" values="0.65;1;0.7;1;0.65" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.08 0.92;0.96 1.08;1 1" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M0 18 C-8 8 -7 -3 0 -15 C7 -3 8 8 0 18Z" fill="#FFD166">
      <animate attributeName="opacity" values="0.7;1;0.75;1;0.7" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Flame accent right -->
  <g transform="translate(1108 88)" filter="url(#softGlow)">
    <path d="M0 32 C-16 16 -14 -6 0 -28 C14 -6 16 16 0 32Z" fill="#FF3CAC">
      <animate attributeName="opacity" values="0.65;1;0.7;1;0.65" dur="2.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.08 0.92;0.96 1.08;1 1" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M0 18 C-8 8 -7 -3 0 -15 C7 -3 8 8 0 18Z" fill="#FFD166">
      <animate attributeName="opacity" values="0.7;1;0.75;1;0.7" dur="1.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Small particles -->
  <circle cx="250" cy="86" r="2.2" fill="#00F5FF" filter="url(#glow)">
    <animate attributeName="cy" values="96;76;96" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="95" r="2" fill="#FF7A18" filter="url(#glow)">
    <animate attributeName="cy" values="102;78;102" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="112" r="2.4" fill="#FF3CAC" filter="url(#glow)">
    <animate attributeName="cy" values="118;88;118" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Title -->
  <text x="600" y="95" text-anchor="middle"
        font-size="36" font-weight="700" fill="#F8F8FF" font-family="Segoe UI, Arial, sans-serif"
        letter-spacing="3" filter="url(#textGlow)">
    GITHUB STATS
  </text>

  <!-- Subtitle -->
  <text x="600" y="128" text-anchor="middle"
        font-size="18" fill="#B8C7FF" font-family="Segoe UI, Arial, sans-serif"
        letter-spacing="1.2">
    Neon Cyber Energy + Flame Accents
  </text>

  <!-- Bottom accent line -->
  <line x1="350" y1="145" x2="850" y2="145" stroke="url(#strokeGrad)" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </line>
</svg>