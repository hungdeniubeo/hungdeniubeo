<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">AI and developer analytics</title>
  <desc id="desc">A dark intelligent analytics header with connected repository data signals.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1018"/>
      <stop offset="52%" stop-color="#101725"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="signal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E9EF7"/>
      <stop offset="52%" stop-color="#8E2DE2"/>
      <stop offset="100%" stop-color="#4DEEEA"/>
    </linearGradient>
    <radialGradient id="blueAura">
      <stop offset="0%" stop-color="#2E9EF7" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#2E9EF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetAura">
      <stop offset="0%" stop-color="#8E2DE2" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#8E2DE2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#c9d1d9" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect x="28" y="20" width="1144" height="200" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1200" height="240" rx="28" fill="url(#background)"/>
  <rect width="1200" height="240" rx="28" fill="url(#grid)"/>
  <g clip-path="url(#panelClip)">
    <circle cx="90" cy="40" r="190" fill="url(#blueAura)"/>
    <circle cx="1080" cy="210" r="220" fill="url(#violetAura)"/>
  </g>
  <rect x="28" y="20" width="1144" height="200" rx="24" fill="#0d1117" fill-opacity=".25" stroke="url(#signal)" stroke-width="1.4"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(70 51)">
      <circle cx="5" cy="5" r="5" fill="#4DEEEA" filter="url(#glow)">
        <animate attributeName="opacity" values=".4;1;.4" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <text x="23" y="10" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="2.2">LIVE DEVELOPMENT SIGNAL</text>
    </g>
    <text x="70" y="111" fill="#ffffff" font-size="38" font-weight="700" letter-spacing="1.1">AI / DEVELOPER</text>
    <text x="70" y="151" fill="#7ee7e4" font-size="30" font-weight="700" letter-spacing="1.8">ANALYTICS</text>
    <text x="72" y="181" fill="#b7c3d7" font-size="14">Real repository data · language patterns · activity</text>

    <g transform="translate(982 120)">
      <g fill="none" stroke="#33435e" stroke-width="1.6" stroke-dasharray="4 10" stroke-linecap="round">
        <path d="M0 0L-122 -54M0 0L-135 51M0 0L108 -54M0 0L126 44"/>
        <animate attributeName="stroke-dashoffset" values="28;0" dur="6.4s" repeatCount="indefinite"/>
      </g>
      <circle r="31" fill="#101725" stroke="url(#signal)" stroke-width="2" filter="url(#glow)"/>
      <circle r="20" fill="#8E2DE2" fill-opacity=".12" stroke="#4DEEEA" stroke-opacity=".45"/>
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="1.3">DATA</text>
    </g>

    <g font-size="9" font-weight="700" letter-spacing="1.2" text-anchor="middle">
      <g transform="translate(860 66)">
        <circle r="6" fill="#2E9EF7" filter="url(#glow)"/>
        <text y="-13" fill="#79c0ff">PROFILE</text>
      </g>
      <g transform="translate(847 171)">
        <circle r="6" fill="#4DEEEA" filter="url(#glow)"/>
        <text y="22" fill="#7ee7e4">LANGUAGES</text>
      </g>
      <g transform="translate(1090 66)">
        <circle r="6" fill="#8E2DE2" filter="url(#glow)"/>
        <text y="-13" fill="#d2a8ff">CODE</text>
      </g>
      <g transform="translate(1108 164)">
        <circle r="6" fill="#4DEEEA" filter="url(#glow)"/>
        <text y="22" fill="#7ee7e4">ACTIVITY</text>
      </g>
    </g>
  </g>

  <g transform="translate(72 199)">
    <rect width="440" height="2" rx="1" fill="#263349"/>
    <rect width="125" height="2" rx="1" fill="url(#signal)" filter="url(#glow)">
      <animate attributeName="x" values="0;315;315" keyTimes="0;.25;1" dur="6.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M52 67V44H75 M1125 44H1148V67 M52 173V196H75 M1125 196H1148V173" fill="none" stroke="#4DEEEA" stroke-width="2" stroke-linecap="round" opacity=".5"/>
</svg>
