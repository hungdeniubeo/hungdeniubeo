<svg xmlns="http://www.w3.org/2000/svg" width="580" height="260" viewBox="0 0 580 260" role="img" aria-labelledby="title desc">
<title id="title">IT Support Ticket</title><desc id="desc">A stylized support dashboard with ticket cards and investigation stages in violet and cyan.</desc>
