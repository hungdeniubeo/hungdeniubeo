<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hung Nguyen developer profile</title>
  <desc id="desc">A dark futuristic banner showing Hung Nguyen's journey from IT Support through Software Development toward AI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="52%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="journey" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E9EF7"/>
      <stop offset="52%" stop-color="#8E2DE2"/>
      <stop offset="100%" stop-color="#4DEEEA"/>
    </linearGradient>
    <radialGradient id="blueAura">
      <stop offset="0%" stop-color="#2E9EF7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2E9EF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkAura">
      <stop offset="0%" stop-color="#FF2E88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF2E88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c9d1d9" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect x="24" y="20" width="1152" height="320" rx="26"/>
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#background)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>

  <g clip-path="url(#panelClip)">
    <circle cx="120" cy="54" r="245" fill="url(#blueAura)"/>
    <circle cx="1080" cy="310" r="260" fill="url(#pinkAura)"/>
  </g>

  <rect x="24" y="20" width="1152" height="320" rx="26" fill="#0d1117" fill-opacity="0.28" stroke="url(#journey)" stroke-width="1.5"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g font-size="12" font-weight="700" letter-spacing="2.5">
      <text x="62" y="59" fill="#79c0ff">HUNG NGUYEN / PROFILE</text>
      <text x="1138" y="59" text-anchor="end" fill="#8b949e">IT → DEV → AI</text>
    </g>

    <text x="600" y="133" text-anchor="middle" fill="#ffffff" font-size="56" font-weight="700" letter-spacing="1.6">HUNG NGUYEN</text>
    <text x="600" y="177" text-anchor="middle" fill="url(#journey)" font-size="24" font-weight="700" letter-spacing="1.1">IT SUPPORT → SOFTWARE DEVELOPMENT → AI</text>
    <text x="600" y="211" text-anchor="middle" fill="#b7c3d7" font-size="17">I fix problems, automate repetitive work, and build practical tools.</text>

    <text x="62" y="278" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="2.2">TRAJECTORY</text>

    <g text-anchor="middle">
      <text x="180" y="308" fill="#79c0ff" font-size="16" font-weight="700" letter-spacing="1.3">IT SUPPORT</text>
      <text x="180" y="328" fill="#8b949e" font-size="10" font-weight="700" letter-spacing="1.8">CURRENT</text>

      <text x="600" y="308" fill="#d2a8ff" font-size="16" font-weight="700" letter-spacing="1.3">SOFTWARE DEVELOPMENT</text>
      <text x="600" y="328" fill="#8b949e" font-size="10" font-weight="700" letter-spacing="1.8">BUILDING</text>

      <text x="1020" y="308" fill="#7ee7e4" font-size="16" font-weight="700" letter-spacing="1.3">AI</text>
      <text x="1020" y="328" fill="#8b949e" font-size="10" font-weight="700" letter-spacing="1.8">EXPLORING</text>
    </g>
  </g>

  <g>
    <line x1="180" y1="274" x2="1020" y2="274" stroke="#263349" stroke-width="6" stroke-linecap="round"/>
    <line x1="180" y1="274" x2="1020" y2="274" stroke="url(#journey)" stroke-width="2" stroke-linecap="round" stroke-dasharray="840" stroke-dashoffset="840">
      <animate attributeName="stroke-dashoffset" values="840;0;0" keyTimes="0;0.9;1" dur="6.6s" repeatCount="indefinite"/>
    </line>

    <g fill="#0d1117" stroke-width="3">
      <circle cx="180" cy="274" r="8" stroke="#2E9EF7"/>
      <circle cx="600" cy="274" r="8" stroke="#8E2DE2"/>
      <circle cx="1020" cy="274" r="8" stroke="#4DEEEA"/>
    </g>

    <circle cx="180" cy="274" r="5" fill="#2E9EF7" filter="url(#glow)">
      <animate attributeName="cx" values="180;600;1020;1020" keyTimes="0;0.48;0.96;1" dur="6.6s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#2E9EF7;#8E2DE2;#4DEEEA;#4DEEEA" keyTimes="0;0.48;0.96;1" dur="6.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path d="M48 70V44H74 M1126 44H1152V70 M48 290V316H74 M1126 316H1152V290" fill="none" stroke="#4DEEEA" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
</svg>
