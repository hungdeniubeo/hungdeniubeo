<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hung Nguyen — AI, automation, software, and systems</title>
  <desc id="desc">An intelligent developer workspace showing a truthful path from IT Support through software and automation toward AI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1018"/>
      <stop offset="52%" stop-color="#101725"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="signal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E9EF7"/>
      <stop offset="52%" stop-color="#8E2DE2"/>
      <stop offset="100%" stop-color="#4DEEEA"/>
    </linearGradient>
    <linearGradient id="sweepBloom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E9EF7" stop-opacity="0"/>
      <stop offset="34%" stop-color="#8E2DE2" stop-opacity=".05"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="70%" stop-color="#4DEEEA" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#4DEEEA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E2DE2" stop-opacity="0"/>
      <stop offset="44%" stop-color="#c6b6ff" stop-opacity=".07"/>
      <stop offset="51%" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset="59%" stop-color="#a6ffff" stop-opacity=".11"/>
      <stop offset="100%" stop-color="#4DEEEA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blueAura">
      <stop offset="0%" stop-color="#2E9EF7" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#2E9EF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetAura">
      <stop offset="0%" stop-color="#8E2DE2" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#8E2DE2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#c9d1d9" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-25%" width="180%" height="150%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="bannerClip">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <g clip-path="url(#bannerClip)">
    <circle cx="80" cy="80" r="230" fill="url(#blueAura)"/>
    <circle cx="1060" cy="230" r="260" fill="url(#violetAura)"/>
  </g>
  <rect x="22" y="20" width="1156" height="320" rx="24" fill="#0d1117" fill-opacity=".24" stroke="url(#signal)" stroke-width="1.4" stroke-opacity=".82"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g font-size="11" font-weight="700" letter-spacing="2.2">
      <text x="62" y="58" fill="#79c0ff">HUNG NGUYEN / INTELLIGENT WORKSPACE</text>
      <text x="1138" y="58" text-anchor="end" fill="#8b949e">AI · AUTOMATION · SOFTWARE · SYSTEMS</text>
    </g>

    <text x="66" y="124" fill="#ffffff" font-size="50" font-weight="700" letter-spacing="1.2">HUNG NGUYEN</text>
    <text x="66" y="174" fill="url(#signal)" font-size="34" font-weight="700" letter-spacing="1.1">AI + AUTOMATION</text>
    <text x="68" y="207" fill="#b7c3d7" font-size="18" font-weight="700" letter-spacing=".5">IT SUPPORT → SOFTWARE DEVELOPMENT</text>
    <text x="68" y="239" fill="#8b949e" font-size="15">Solving systems. Automating workflows. Building toward intelligent software.</text>

    <g transform="translate(965 146)">
      <g fill="none" stroke="#33435e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 9">
        <path d="M0 0L-104 -59M0 0L-116 42M0 0L111 -62M0 0L120 39M0 0L4 78"/>
        <animate attributeName="stroke-dashoffset" values="26;0" dur="6.4s" repeatCount="indefinite"/>
      </g>
      <circle r="35" fill="#101725" stroke="url(#signal)" stroke-width="2" filter="url(#glow)"/>
      <circle r="24" fill="#8E2DE2" fill-opacity=".12" stroke="#4DEEEA" stroke-opacity=".45"/>
      <text x="0" y="7" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="1.6">AI</text>
      <circle r="41" fill="none" stroke="#4DEEEA" stroke-width="1" opacity=".12">
        <animate attributeName="r" values="38;48;38" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;.04;.2" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-size="9" font-weight="700" letter-spacing="1.3" text-anchor="middle">
      <g transform="translate(861 87)">
        <circle r="6" fill="#2E9EF7" filter="url(#glow)"/>
        <text y="-13" fill="#79c0ff">SYSTEMS</text>
      </g>
      <g transform="translate(849 188)">
        <circle r="6" fill="#4DEEEA" filter="url(#glow)"/>
        <text y="22" fill="#7ee7e4">APIs</text>
      </g>
      <g transform="translate(1076 84)">
        <circle r="6" fill="#8E2DE2" filter="url(#glow)"/>
        <text y="-13" fill="#d2a8ff">LLMs</text>
      </g>
      <g transform="translate(1085 185)">
        <circle r="6" fill="#2E9EF7" filter="url(#glow)"/>
        <text y="22" fill="#79c0ff">CODE</text>
      </g>
      <g transform="translate(969 224)">
        <circle r="6" fill="#FF2E88" filter="url(#glow)"/>
        <text y="22" fill="#ff9ac4">AUTOMATION</text>
      </g>
    </g>

    <g font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      <text x="110" y="330" fill="#79c0ff">SYSTEMS</text>
      <text x="435" y="330" fill="#bca7ff">AUTOMATION</text>
      <text x="765" y="330" fill="#d2a8ff">SOFTWARE</text>
      <text x="1090" y="330" fill="#7ee7e4">AI</text>
    </g>
  </g>

  <g>
    <line x1="110" y1="300" x2="1090" y2="300" stroke="#28354a" stroke-width="5" stroke-linecap="round"/>
    <line x1="110" y1="300" x2="1090" y2="300" stroke="url(#signal)" stroke-width="2" stroke-linecap="round" stroke-dasharray="980" stroke-dashoffset="980">
      <animate attributeName="stroke-dashoffset" values="980;0;0" keyTimes="0;.9;1" dur="6.4s" repeatCount="indefinite"/>
    </line>
    <g fill="#0d1117" stroke-width="2.5">
      <circle cx="110" cy="300" r="7" stroke="#2E9EF7"/>
      <circle cx="435" cy="300" r="7" stroke="#8E2DE2"/>
      <circle cx="765" cy="300" r="7" stroke="#8E2DE2"/>
      <circle cx="1090" cy="300" r="7" stroke="#4DEEEA"/>
    </g>
    <circle cx="110" cy="300" r="4.5" fill="#2E9EF7" filter="url(#glow)">
      <animate attributeName="cx" values="110;435;765;1090;1090" keyTimes="0;.3;.6;.92;1" dur="6.4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#2E9EF7;#8E2DE2;#8E2DE2;#4DEEEA;#4DEEEA" keyTimes="0;.3;.6;.92;1" dur="6.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path d="M48 69V44H73 M1127 44H1152V69 M48 291V316H73 M1127 316H1152V291" fill="none" stroke="#4DEEEA" stroke-width="2" stroke-linecap="round" opacity=".5"/>

  <g clip-path="url(#bannerClip)" pointer-events="none">
    <g transform="skewX(-18)">
      <rect x="-520" y="-30" width="250" height="420" fill="url(#sweepBloom)" filter="url(#softGlow)">
        <animate attributeName="x" values="-520;1550;1550" keyTimes="0;.25;1" keySplines=".22 .61 .36 1;0 0 1 1" calcMode="spline" dur="6.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="-450" y="-30" width="110" height="420" fill="url(#sweepCore)">
        <animate attributeName="x" values="-450;1620;1620" keyTimes="0;.25;1" keySplines=".22 .61 .36 1;0 0 1 1" calcMode="spline" dur="6.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
