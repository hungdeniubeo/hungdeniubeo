<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Hung Nguyen profile banner</title>
  <desc id="desc">IT Support, Software Development and AI profile banner</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E9EF7"/>
      <stop offset="50%" stop-color="#8E2DE2"/>
      <stop offset="100%" stop-color="#FF2E88"/>
      <animate attributeName="x1" values="0;0.35;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.65;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowBlue">
      <stop offset="0%" stop-color="#2E9EF7" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#2E9EF7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPink">
      <stop offset="0%" stop-color="#FF2E88" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FF2E88" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>

  <circle cx="120" cy="70" r="170" fill="url(#glowBlue)">
    <animate attributeName="cx" values="120;190;120" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="245" r="210" fill="url(#glowPink)">
    <animate attributeName="cx" values="1080;1000;1080" dur="10s" repeatCount="indefinite"/>
  </circle>

  <rect x="48" y="38" width="1104" height="224" rx="20" fill="#0d1117" fill-opacity="0.42" stroke="url(#accent)" stroke-opacity="0.75"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="105" font-size="44" font-weight="700" fill="#ffffff">Hi, I&apos;m Hung 👋</text>
    <text x="600" y="145" font-size="21" font-weight="600" fill="url(#accent)">IT Support → Software Development → AI</text>
    <text x="600" y="183" font-size="17" fill="#c9d1d9">I like fixing problems, automating repetitive work, and building practical tools.</text>

    <g transform="translate(345 210)">
      <rect width="145" height="34" rx="17" fill="#2E9EF7" fill-opacity="0.14" stroke="#2E9EF7" stroke-opacity="0.7"/>
      <text x="72.5" y="22" font-size="14" font-weight="700" fill="#79c0ff">🛠 IT Support</text>
    </g>
    <g transform="translate(510 210)">
      <rect width="180" height="34" rx="17" fill="#8E2DE2" fill-opacity="0.14" stroke="#8E2DE2" stroke-opacity="0.7"/>
      <text x="90" y="22" font-size="14" font-weight="700" fill="#c9a7ff">💻 Software Dev</text>
    </g>
    <g transform="translate(710 210)">
      <rect width="145" height="34" rx="17" fill="#FF2E88" fill-opacity="0.14" stroke="#FF2E88" stroke-opacity="0.7"/>
      <text x="72.5" y="22" font-size="14" font-weight="700" fill="#ff8fc1">🤖 AI</text>
    </g>
  </g>

  <circle cx="1135" cy="38" r="4" fill="#2E9EF7" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1160" cy="58" r="3" fill="#FF2E88" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/>
  </circle>
</svg>
