<svg xmlns="http://www.w3.org/2000/svg" width="320" height="190" viewBox="0 0 320 190" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio</title>
  <desc id="desc">Personal portfolio website built and hosted on GitHub Pages.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4DEEEA"/>
      <stop offset="100%" stop-color="#2E9EF7"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0%" stop-color="#4DEEEA" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#4DEEEA" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="190" rx="18" fill="#0d1117"/>
  <circle cx="286" cy="24" r="92" fill="url(#aura)"/>
  <rect x=".75" y=".75" width="318.5" height="188.5" rx="17.25" fill="none" stroke="url(#edge)" stroke-width="1.5" stroke-opacity=".72"/>
  <path d="M18 12H302" stroke="url(#edge)" stroke-width="2" stroke-dasharray="90 32">
    <animate attributeName="stroke-dashoffset" values="0;-122" dur="8s" begin="1.6s" repeatCount="indefinite"/>
  </path>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="20" y="31" fill="#7ee7e4" font-size="10" font-weight="700" letter-spacing="1.8">03 / PERSONAL SITE</text>
    <text x="20" y="68" fill="#ffffff" font-size="25" font-weight="700">PORTFOLIO</text>
    <text x="20" y="94" fill="#c9d1d9" font-size="13">Personal portfolio website</text>
    <text x="20" y="114" fill="#8b949e" font-size="11">Built + hosted on GitHub Pages</text>
    <g font-size="10" font-weight="700" text-anchor="middle">
      <g transform="translate(20 143)">
        <rect width="50" height="25" rx="12.5" fill="#4DEEEA" fill-opacity=".1" stroke="#4DEEEA" stroke-opacity=".7"/>
        <text x="25" y="16.5" fill="#7ee7e4">HTML</text>
      </g>
      <g transform="translate(78 143)">
        <rect width="44" height="25" rx="12.5" fill="#4DEEEA" fill-opacity=".08" stroke="#4DEEEA" stroke-opacity=".6"/>
        <text x="22" y="16.5" fill="#7ee7e4">CSS</text>
      </g>
      <g transform="translate(130 143)">
        <rect width="78" height="25" rx="12.5" fill="#2E9EF7" fill-opacity=".1" stroke="#2E9EF7" stroke-opacity=".65"/>
        <text x="39" y="16.5" fill="#79c0ff">JAVASCRIPT</text>
      </g>
    </g>
  </g>
  <g transform="translate(246 27)" fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round" filter="url(#glow)">
    <rect width="58" height="43" rx="6"/>
    <path d="M0 13H58M9 7H10M16 7H17M23 7H24M18 27L24 33L18 39M34 39L42 27"/>
