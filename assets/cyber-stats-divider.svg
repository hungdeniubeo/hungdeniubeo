<svg viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neon divider">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#FF3CAC"/>
      <stop offset="100%" stop-color="#FF7A18"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="90" fill="transparent"/>

  <path d="M0 45 Q30 25 60 45 T120 45 T180 45 T240 45 T300 45 T360 45 T420 45 T480 45 T540 45 T600 45 T660 45 T720 45 T780 45 T840 45 T900 45 T960 45 T1020 45 T1080 45 T1140 45 T1200 45"
        stroke="url(#lineGrad)" stroke-width="4" fill="none" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-60 0;0 0" dur="4s" repeatCount="indefinite"/>
  </path>

  <circle cx="180" cy="45" r="3" fill="#00F5FF" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="45" r="3" fill="#FF3CAC" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="45" r="3" fill="#FF7A18" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</svg>