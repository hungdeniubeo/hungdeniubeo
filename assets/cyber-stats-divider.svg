<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-labelledby="title desc">
  <title id="title">Animated cyber signal divider</title>
  <desc id="desc">A subtle blue, purple, and cyan animated divider.</desc>
  <defs>
    <linearGradient id="signal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E9EF7" stop-opacity="0"/>
      <stop offset="24%" stop-color="#2E9EF7"/>
      <stop offset="50%" stop-color="#8E2DE2"/>
      <stop offset="76%" stop-color="#4DEEEA"/>
      <stop offset="100%" stop-color="#4DEEEA" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M52 36H456L474 24L492 48L510 36H690L708 24L726 48L744 36H1148" fill="none" stroke="#202b3d" stroke-width="2"/>
  <path d="M52 36H456L474 24L492 48L510 36H690L708 24L726 48L744 36H1148" fill="none" stroke="url(#signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" stroke-dasharray="180 80">
    <animate attributeName="stroke-dashoffset" values="260;0" dur="6.4s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(600 36)">
    <path d="M0 -13L12 -6.5V6.5L0 13L-12 6.5V-6.5Z" fill="#0d1117" stroke="#8E2DE2" stroke-width="1.5" filter="url(#glow)">
      <animate attributeName="stroke" values="#8E2DE2;#4DEEEA;#2E9EF7;#8E2DE2" dur="6.4s" repeatCount="indefinite"/>
    </path>
    <circle r="3.5" fill="#4DEEEA" filter="url(#glow)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#4DEEEA" filter="url(#glow)">
    <circle cx="320" cy="36" r="2.5">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="36" r="2.5">
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
