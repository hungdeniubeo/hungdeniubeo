<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-labelledby="traffic-title traffic-desc">
  <title id="traffic-title">Traffic Sign computer vision artwork</title>
  <desc id="traffic-desc">A dark project card with a camera frame detecting a road sign, a confidence meter, and a subtle scanning line.</desc>
  <defs>
    <linearGradient id="traffic-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091622"/><stop offset="1" stop-color="#161329"/></linearGradient>
    <linearGradient id="traffic-scan-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#67e8f9" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9" stop-opacity=".16"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></linearGradient>
    <filter id="traffic-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      .traffic-scan { animation: traffic-scan 5.8s ease-in-out infinite; }
      .traffic-corner { animation: traffic-corner 3.2s ease-in-out infinite; }
      @keyframes traffic-scan { 0%, 12% { transform: translateY(0); opacity: 0; } 24%, 78% { opacity: 1; } 88%, 100% { transform: translateY(100px); opacity: 0; } }
      @keyframes traffic-corner { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .traffic-scan, .traffic-corner { animation: none !important; } }
    </style>
  </defs>
  <rect x="1" y="1" width="578" height="248" rx="18" fill="url(#traffic-bg)" stroke="#3e4565"/>
  <path d="M28 48H552" stroke="#2d3850"/>
  <circle cx="29" cy="25" r="3.5" fill="#d6a0bd"/>
  <text x="42" y="29" fill="#98a4be" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.6">PROJECT / 04</text>
  <text x="551" y="29" text-anchor="end" fill="#756c91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.3">VISION / GTSRB</text>

  <g transform="translate(39 68)">
    <rect width="330" height="139" rx="11" fill="#070f1b" stroke="#32485f"/>
    <path d="M19 39V18H40M290 18H311V39M19 100V121H40M290 121H311V100" fill="none" stroke="#67e8f9" stroke-width="2.5" class="traffic-corner"/>
    <path d="M62 121 129 49l56 57 40-39 69 54" fill="none" stroke="#263c51" stroke-width="2"/>
    <path d="M105 121 105 84M270 121V78" stroke="#263c51" stroke-width="5"/>
    <g transform="translate(124 30)">
      <path d="m40 8 36 64H4Z" fill="#d6a0bd" fill-opacity=".12" stroke="#d6a0bd" stroke-width="4"/>
      <circle cx="40" cy="51" r="12" fill="none" stroke="#e5dbe7" stroke-width="3"/>
      <path d="M40 39V63M28 51H52" stroke="#e5dbe7" stroke-width="2"/>
    </g>
    <rect x="113" y="23" width="102" height="91" rx="7" fill="none" stroke="#8da2fb" stroke-width="1.5" stroke-dasharray="5 4"/>
    <g class="traffic-scan">
      <rect x="20" y="19" width="290" height="12" fill="url(#traffic-scan-fill)" filter="url(#traffic-glow)"/>
      <path d="M20 25H310" stroke="#67e8f9" stroke-opacity=".75"/>
    </g>
    <text x="26" y="131" fill="#657995" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8">CAM / 01</text>
    <text x="304" y="131" text-anchor="end" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8">FRAME LOCKED</text>
  </g>

  <g transform="translate(401 76)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="9" fill="#71829b" font-size="9" letter-spacing="1.2">DETECTION</text>
    <text x="0" y="39" fill="#f0edf6" font-size="18" font-weight="700">SIGN / 14</text>
    <text x="0" y="58" fill="#b7a6e8" font-size="10">STOP</text>
    <text x="0" y="91" fill="#71829b" font-size="9">CONFIDENCE</text>
    <rect x="0" y="101" width="139" height="6" rx="3" fill="#23344b"/>
    <rect x="0" y="101" width="121" height="6" rx="3" fill="#67e8f9"/>
    <text x="139" y="124" text-anchor="end" fill="#67e8f9" font-size="10">0.87</text>
  </g>
  <g transform="translate(30 230)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">
    <text fill="#67e8f9">FRAME</text><text x="44" fill="#526984">→</text><text x="65" fill="#8da2fb">CNN</text><text x="94" fill="#526984">→</text><text x="115" fill="#d6a0bd">CLASS</text>
    <text x="521" text-anchor="end" fill="#756c91">IMAGE / WEBCAM</text>
  </g>
</svg>
