<svg xmlns="http://www.w3.org/2000/svg" width="320" height="190" viewBox="0 0 320 190" role="img" aria-labelledby="title desc">
  <title id="title">Schedulework</title>
  <desc id="desc">Offline desktop shift-scheduling app with drag-and-drop, conflict detection, and export.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E2DE2"/>
      <stop offset="100%" stop-color="#FF2E88"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0%" stop-color="#8E2DE2" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#8E2DE2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="190" rx="18" fill="#0d1117"/>
  <circle cx="286" cy="24" r="92" fill="url(#aura)"/>
  <rect x=".75" y=".75" width="318.5" height="188.5" rx="17.25" fill="none" stroke="url(#edge)" stroke-width="1.5" stroke-opacity=".72"/>
  <path d="M18 12H302" stroke="url(#edge)" stroke-width="2" stroke-dasharray="90 32">
    <animate attributeName="stroke-dashoffset" values="0;-122" dur="8s" begin=".8s" repeatCount="indefinite"/>
  </path>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="20" y="31" fill="#d2a8ff" font-size="10" font-weight="700" letter-spacing="1.8">02 / DESKTOP APPLICATION</text>
    <text x="20" y="68" fill="#ffffff" font-size="25" font-weight="700">SCHEDULEWORK</text>
    <text x="20" y="94" fill="#c9d1d9" font-size="13">Offline shift scheduling</text>
    <text x="20" y="114" fill="#8b949e" font-size="11">Drag, detect conflicts, export</text>
    <g font-size="10" font-weight="700" text-anchor="middle">
      <g transform="translate(20 143)">
        <rect width="52" height="25" rx="12.5" fill="#8E2DE2" fill-opacity=".13" stroke="#8E2DE2" stroke-opacity=".72"/>
        <text x="26" y="16.5" fill="#d2a8ff">TAURI</text>
      </g>
      <g transform="translate(80 143)">
        <rect width="56" height="25" rx="12.5" fill="#8E2DE2" fill-opacity=".1" stroke="#8E2DE2" stroke-opacity=".6"/>
        <text x="28" y="16.5" fill="#d2a8ff">REACT</text>
      </g>
      <g transform="translate(144 143)">
        <rect width="78" height="25" rx="12.5" fill="#FF2E88" fill-opacity=".1" stroke="#FF2E88" stroke-opacity=".65"/>
        <text x="39" y="16.5" fill="#ff9ac4">TYPESCRIPT</text>
      </g>
    </g>
  </g>
  <g transform="translate(252 25)" fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round" filter="url(#glow)">
    <rect x="0" y="6" width="52" height="42" rx="7"/>
    <path d="M0 18H52M13 0V11M39 0V11M12 29H20M28 29H40M12 39H25"/>
  </g>
</svg>
