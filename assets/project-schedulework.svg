<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-labelledby="schedule-title schedule-desc">
  <title id="schedule-title">Schedulework timeline artwork</title>
  <desc id="schedule-desc">A dark project card with a weekly shift planning grid, assigned time blocks, staffing totals, and a slowly moving scan line.</desc>
  <defs>
    <linearGradient id="schedule-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1728"/><stop offset="1" stop-color="#12142b"/></linearGradient>
    <filter id="schedule-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      .schedule-scan { animation: schedule-scan 7s ease-in-out infinite; }
      @keyframes schedule-scan { 0%, 12% { transform: translateX(0); opacity: 0; } 22%, 78% { opacity: .75; } 88%, 100% { transform: translateX(353px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .schedule-scan { animation: none !important; opacity: .38; } }
    </style>
  </defs>
  <rect x="1" y="1" width="578" height="248" rx="18" fill="url(#schedule-bg)" stroke="#344b68"/>
  <path d="M28 48H552" stroke="#263b54"/>
  <circle cx="29" cy="25" r="3.5" fill="#67e8f9"/>
  <text x="42" y="29" fill="#8fa2bd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.6">PROJECT / 01</text>
  <text x="551" y="29" text-anchor="end" fill="#63758d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.3">LOCAL DATA</text>

  <g transform="translate(29 67)">
    <text x="0" y="12" fill="#95a8c2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2">WEEK / 26</text>
    <text x="522" y="12" text-anchor="end" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">8 ASSIGNED</text>
    <rect y="26" width="522" height="127" rx="10" fill="#07101d" stroke="#2d425b"/>
    <path d="M93 26V153M164 26V153M235 26V153M306 26V153M377 26V153M448 26V153" stroke="#263a51"/>
    <path d="M0 58H522M0 90H522M0 122H522" stroke="#263a51"/>
    <g fill="#71829b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" text-anchor="middle">
      <text x="128" y="44">MON</text><text x="199" y="44">TUE</text><text x="270" y="44">WED</text>
      <text x="341" y="44">THU</text><text x="412" y="44">FRI</text><text x="483" y="44">SAT</text>
    </g>
    <g fill="#8194ad" font-family="Arial, Helvetica, sans-serif" font-size="10">
      <text x="13" y="80">MEAT</text><text x="13" y="112">SOUP</text><text x="13" y="144">SALAD</text>
    </g>
    <rect x="103" y="66" width="112" height="16" rx="5" fill="#67e8f9" fill-opacity=".28" stroke="#67e8f9" stroke-opacity=".72"/>
    <rect x="245" y="66" width="55" height="16" rx="5" fill="#8da2fb" fill-opacity=".35" stroke="#8da2fb"/>
    <rect x="174" y="98" width="120" height="16" rx="5" fill="#b7a6e8" fill-opacity=".3" stroke="#b7a6e8"/>
    <rect x="316" y="98" width="126" height="16" rx="5" fill="#d6a0bd" fill-opacity=".25" stroke="#d6a0bd" stroke-opacity=".8"/>
    <rect x="387" y="130" width="126" height="16" rx="5" fill="#67e8f9" fill-opacity=".22" stroke="#67e8f9" stroke-opacity=".7"/>
    <g class="schedule-scan">
      <rect x="102" y="54" width="1.5" height="93" fill="#67e8f9"/>
      <rect x="98" y="54" width="9" height="93" fill="#67e8f9" opacity=".11" filter="url(#schedule-glow)"/>
    </g>
  </g>
  <g transform="translate(30 230)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">
    <text fill="#67e8f9">DRAG</text><text x="46" fill="#526984">→</text><text x="67" fill="#8da2fb">CHECK</text><text x="121" fill="#526984">→</text><text x="143" fill="#b7a6e8">EXPORT</text>
    <text x="521" text-anchor="end" fill="#63758d">OFFLINE</text>
  </g>
</svg>
