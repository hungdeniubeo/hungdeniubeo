<svg xmlns="http://www.w3.org/2000/svg" width="420" height="480" viewBox="0 0 420 480" role="img" aria-labelledby="toolbox-mobile-title toolbox-mobile-desc">
  <title id="toolbox-mobile-title">Project-grounded working set for narrow screens</title>
  <desc id="toolbox-mobile-desc">A two-by-two system map grouping technologies into interface, desktop, services, and vision layers, with Git and GitHub Actions on a shared delivery rail.</desc>
  <defs>
    <linearGradient id="toolbox-mobile-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#081422"/>
      <stop offset=".58" stop-color="#0b1526"/>
      <stop offset="1" stop-color="#151329"/>
    </linearGradient>
    <linearGradient id="toolbox-mobile-rail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67e8f9"/><stop offset=".36" stop-color="#8da2fb"/><stop offset=".7" stop-color="#b7a6e8"/><stop offset="1" stop-color="#d6a0bd"/>
    </linearGradient>
    <pattern id="toolbox-mobile-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8da2fb" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="toolbox-mobile-clip"><rect width="420" height="480" rx="18"/></clipPath>
  </defs>

